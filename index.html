</style></head><body><div class="shell"><aside class="side"><div class="brand">✚ Dose<span>Quest</span></div><div class="label">YOUR STUDY SPACE</div><nav class="nav"><button class="active" data-view="home">⌂　Home</button><button data-view="library">▤　Library</button><button data-view="flash">▧　Flashcards</button><button data-view="quiz">✳　NCLEX practice</button><button data-view="teach">◖　Teach-back</button><button data-view="instructor">▦　Instructor</button></nav><div class="sidefoot"><div class="profile"><span class="avatar" id="avatar">N</span><span><b id="student">Nursing student</b><small>Learning profile</small></span><button id="edit">···</button></div></div></aside><main class="main"><header class="top"><span class="crumb">Pharmacology　/　<b id="title">Home</b></span><span class="save"><i></i> Saved on this device</span></header><div class="content" id="view"></div><footer>For learning and clinical preparation. Always follow current orders, policy, and drug references in practice.</footer></main></div><dialog id="profileDialog"><form method="dialog"><h2>Your study profile</h2><p class="privacy">Progress is stored in this browser on this device.</p><input id="nameInput" maxlength="40" placeholder="Your name"><div class="row"><button class="button soft">Cancel</button><button class="button primary" value="save">Save profile</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
